<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CanIGame</title>
    <!--
      Content Security Policy — https://www.electronjs.org/docs/latest/tutorial/security#7-define-a-content-security-policy
      - scripts/fonts/connections: only our own bundle (Vite dev server or file://)
      - styles: Mantine injects inline styles, so 'unsafe-inline' is required there
      - images: our bundle, inline data URIs (placeholders) and RAWG's media CDN
      All network requests to RAWG happen in the main process, so no connect-src for api.rawg.io.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://media.rawg.io;
        font-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'none';
      "
    />
    <!--
      Boot splash: painted from plain HTML/CSS the instant the window opens, before any JS
      loads. React's first render replaces #root's contents, which removes it.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c111d;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 50% at 50% 40%, rgba(237, 84, 27, 0.14), transparent 70%), #0c111d;
        font-family: system-ui, sans-serif;
        -webkit-app-region: drag;
      }
      .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .boot-mark {
        display: block;
        height: 44px;
        width: auto;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-bar {
        position: relative;
        width: 140px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #26314b;
      }
      .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f0662a, #b32f0c);
        animation: boot-slide 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(0.94);
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-bar::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading CanIGame">
        <div class="boot-inner">
          <img
            class="boot-mark"
            src="./src/assets/imgs/logo-wordmark.png"
            alt="CanIGame"
            height="44"
          />
          <div class="boot-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
